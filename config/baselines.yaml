# T38 fixed development settings, not selected on validation.
# The data split continues to use config/data.yaml (seed 42, five folds).
seed: 42
response_model:
  n_estimators: 200
  learning_rate: 0.05
  num_leaves: 31
  min_child_samples: 20
  n_jobs: 1
  deterministic: true
  force_col_wise: true
  verbosity: -1
